name: Docs

"on":
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      READTHEDOCS_BUILD_HOOK_URL: ${{ secrets.READTHEDOCS_BUILD_HOOK_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx docs (dummy builder)
        run: |
          python -m sphinx -b dummy docs docs/_build/dummy

      - name: Validate documentation links
        run: |
          python -m sphinx -b linkcheck docs docs/_build/linkcheck

      - name: Upload docs build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-dummy-build
          path: docs/_build/dummy

      - name: Upload linkcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-linkcheck
          path: docs/_build/linkcheck

      - name: Trigger Read the Docs build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.READTHEDOCS_BUILD_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error -X POST "$READTHEDOCS_BUILD_HOOK_URL"
