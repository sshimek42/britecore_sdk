name: Lint

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pip-audit
        run: |
          python -m pip_audit

      - name: Determine changed-file range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            echo "FROM_REF=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            FROM_REF="${{ github.event.before }}"
            if [ -z "$FROM_REF" ] || [ "$FROM_REF" = "0000000000000000000000000000000000000000" ]; then
              FROM_REF="HEAD^"
            fi
            echo "FROM_REF=$FROM_REF" >> "$GITHUB_ENV"
          fi
          echo "TO_REF=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Run pre-commit hooks (changed files only)
        run: |
          python -m pre_commit run --from-ref "$FROM_REF" --to-ref "$TO_REF"

      - name: Install Vale
        run: |
          VALE_VERSION=3.14.1
          curl -fsSL -o vale.tar.gz "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar -xzf vale.tar.gz vale
          chmod +x vale

      - name: Run Vale on changed Markdown files
        run: |
          mapfile -t changed_md < <(git diff --name-only --diff-filter=ACMRT "$FROM_REF" "$TO_REF" -- '*.md')
          if [ ${#changed_md[@]} -eq 0 ]; then
            echo "No Markdown changes to lint with Vale."
            exit 0
          fi
          ./vale --config=.vale.ini "${changed_md[@]}"

      - name: Run ruff
        run: |
          ruff check src tests

      - name: Run black --check
        run: |
          black --check src tests
