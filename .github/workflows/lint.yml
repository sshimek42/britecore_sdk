name: Lint

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pip-audit
        run: |
          python -m pip_audit

      - name: Run pre-commit hooks (all files)
        run: |
          python -m pre_commit run --all-files

      - name: Install Vale
        run: |
          VALE_VERSION=3.14.1
          curl -fsSL -o vale.tar.gz "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar -xzf vale.tar.gz vale
          chmod +x vale

      - name: Run Vale on changed Markdown files
        run: |
          mapfile -t changed_md < <(git diff --name-only --diff-filter=ACMRT HEAD^ HEAD -- '*.md')
          if [ ${#changed_md[@]} -eq 0 ]; then
            echo "No Markdown changes to lint with Vale."
            exit 0
          fi
          ./vale --config=.vale.ini "${changed_md[@]}"

      - name: Run ruff
        run: |
          ruff check src tests

      - name: Run black --check
        run: |
          black --check src tests
