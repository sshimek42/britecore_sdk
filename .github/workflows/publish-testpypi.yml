name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: testpypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          pyproject-build
          python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/britecore-sdk/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test-install:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          project = data["project"]
          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as out:
              out.write(f"name={project['name']}\n")
              out.write(f"version={project['version']}\n")
          PY

      - name: Smoke test install from TestPyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          PACKAGE_NAME="${{ steps.package.outputs.name }}"
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"

          if [ -z "$PACKAGE_NAME" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "Package metadata outputs were empty. name='$PACKAGE_NAME' version='$PACKAGE_VERSION'"
            exit 1
          fi

          REQUIREMENT="${PACKAGE_NAME}==${PACKAGE_VERSION}"
          echo "Attempting to install $REQUIREMENT from TestPyPI"

          for attempt in 1 2 3 4 5; do
            python -m pip install --index-url https://test.pypi.org/simple --extra-index-url https://pypi.org/simple "$REQUIREMENT" && break
            if [ "$attempt" -eq 5 ]; then
              echo "Package did not become available on TestPyPI in time."
              exit 1
            fi
            echo "Attempt $attempt failed. Waiting 30 seconds for TestPyPI index propagation..."
            sleep 30
          done
