name: Publish to PyPI

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish (for example v2.4.5)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag to publish (must match selected workflow ref, for example v2.4.5)"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source-ref:
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.validate.outputs.checkout_ref }}
    steps:
      - name: Validate event source and checkout ref
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          CALL_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs['release-tag'] }}
        run: |
          python - <<'PY'
          import os
          import re

          event = os.environ.get("EVENT_NAME", "")
          ref = os.environ.get("REF", "")
          ref_name = os.environ.get("REF_NAME", "")
          ref_type = os.environ.get("REF_TYPE", "")
          call_release_tag = os.environ.get("CALL_RELEASE_TAG", "")
          dispatch_release_tag = os.environ.get("DISPATCH_RELEASE_TAG", "")
          input_release_tag = call_release_tag or dispatch_release_tag

          tag_pattern = r"^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$"

          if event in {"workflow_call", "workflow_dispatch"}:
              if ref_type != "tag" or not ref.startswith("refs/tags/"):
                  raise SystemExit(
                      f"{event} must run from a tag ref. In Actions, choose 'Use workflow from' and select a release tag (for example v2.4.5)."
                  )
              if not input_release_tag:
                  expected_input = "release_tag" if event == "workflow_call" else "release-tag"
                  raise SystemExit(f"{event} input '{expected_input}' is required.")
              checkout_ref = ref.split("refs/tags/", 1)[1]
              if input_release_tag != checkout_ref or input_release_tag != ref_name:
                  raise SystemExit(
                      f"Input release tag '{input_release_tag}' must match selected ref tag '{checkout_ref}'."
                  )
          else:
              raise SystemExit(f"Unsupported event '{event}' for publish workflow.")

          if not re.fullmatch(tag_pattern, checkout_ref):
              raise SystemExit(
                  f"Invalid release tag '{checkout_ref}'. Expected SemVer tag format like v2.4.5 or v2.4.5-rc.1."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"checkout_ref={checkout_ref}\n")
          PY

  build:
    needs: validate-source-ref
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-source-ref.outputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          pyproject-build
          python -m twine check dist/*

      - name: Read package metadata from distributions
        id: package
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          dist_dir = Path("dist")
          if not dist_dir.exists():
              raise SystemExit("dist/ directory was not found.")

          wheel_candidates = sorted(dist_dir.glob("*.whl"))
          sdist_candidates = sorted(dist_dir.glob("*.tar.gz"))
          artifact = wheel_candidates[0] if wheel_candidates else sdist_candidates[0] if sdist_candidates else None
          if artifact is None:
              raise SystemExit("No distribution artifacts were found in dist/.")

          name = ""
          version = ""
          if artifact.name.endswith(".whl"):
              parts = artifact.name[:-4].split("-")
              if len(parts) < 2:
                  raise SystemExit(f"Could not parse wheel filename: {artifact.name}")
              name, version = parts[0], parts[1]
          else:
              stem = artifact.name[:-7]
              if "-" not in stem:
                  raise SystemExit(f"Could not parse sdist filename: {artifact.name}")
              name, version = stem.rsplit("-", 1)

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as out:
              out.write(f"name={name}\n")
              out.write(f"version={version}\n")
          PY

      - name: Validate built version matches release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-source-ref.outputs.checkout_ref }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import Version

          release_tag = os.environ["RELEASE_TAG"]
          package_version = os.environ["PACKAGE_VERSION"]
          expected_version = release_tag[1:] if release_tag.startswith("v") else release_tag
          if Version(package_version) != Version(expected_version):
              raise SystemExit(
                  f"Built distribution version '{package_version}' does not match release tag '{release_tag}'."
              )
          print(f"Validated built distribution version {package_version} for {release_tag}")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/britecore-sdk/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  smoke-test-install:
    needs: [validate-source-ref, build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-source-ref.outputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve published distribution URL
        id: resolve-artifact
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          PACKAGE_INDEX_JSON_BASE: https://pypi.org/pypi
          PACKAGE_INDEX_LABEL: PyPI
        run: |
          python scripts/resolve_published_artifact.py \
            --package-name "$PACKAGE_NAME" \
            --package-version "$PACKAGE_VERSION" \
            --json-base "$PACKAGE_INDEX_JSON_BASE" \
            --index-label "$PACKAGE_INDEX_LABEL"

      - name: Smoke test install from PyPI
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.resolve-artifact.outputs.artifact_url }}
        run: |
          python -m pip install --upgrade pip

          if [ -z "$ARTIFACT_URL" ]; then
            echo "Published artifact URL was empty."
            exit 1
          fi

          echo "Installing published artifact from $ARTIFACT_URL"
          python -m pip install --no-cache-dir "$ARTIFACT_URL"

      - name: Smoke test import
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          EXPECTED_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          python - <<'PY'
          import os
          from importlib import metadata

          import britecore_sdk

          package_name = os.environ["PACKAGE_NAME"]
          expected_version = os.environ["EXPECTED_VERSION"]
          runtime_version = britecore_sdk.__version__
          installed_version = metadata.version(package_name)

          if runtime_version != expected_version:
              raise SystemExit(
                  f"Imported britecore_sdk version '{runtime_version}' did not match expected version '{expected_version}'."
              )
          if installed_version != expected_version:
              raise SystemExit(
                  f"Installed distribution version '{installed_version}' did not match expected version '{expected_version}'."
              )

          print(f"Imported britecore_sdk {runtime_version}")
          print(f"Verified installed distribution {package_name}=={installed_version}")
          PY

      - name: Append smoke test summary
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          ARTIFACT_TYPE: ${{ steps.resolve-artifact.outputs.artifact_type }}
          ARTIFACT_URL: ${{ steps.resolve-artifact.outputs.artifact_url }}
        run: |
          {
            echo "### Smoke test completed"
            echo "- Package: \\`$PACKAGE_NAME==$PACKAGE_VERSION\\`"
            echo "- Artifact type: \\`$ARTIFACT_TYPE\\`"
            echo "- Artifact URL: \\`$ARTIFACT_URL\\`"
          } >> "$GITHUB_STEP_SUMMARY"
