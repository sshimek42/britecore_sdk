name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Download release build artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        if: github.event_name != 'workflow_run'
        run: |
          python -m pip install --upgrade pip build twine
          pyproject-build
          python -m twine check dist/*

      - name: Read package metadata from distributions
        id: package
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          dist_dir = Path("dist")
          if not dist_dir.exists():
              raise SystemExit("dist/ directory was not found.")

          wheel_candidates = sorted(dist_dir.glob("*.whl"))
          sdist_candidates = sorted(dist_dir.glob("*.tar.gz"))
          artifact = wheel_candidates[0] if wheel_candidates else sdist_candidates[0] if sdist_candidates else None
          if artifact is None:
              raise SystemExit("No distribution artifacts were found in dist/.")

          name = ""
          version = ""
          if artifact.name.endswith(".whl"):
              parts = artifact.name[:-4].split("-")
              if len(parts) < 2:
                  raise SystemExit(f"Could not parse wheel filename: {artifact.name}")
              name, version = parts[0], parts[1]
          else:
              stem = artifact.name[:-7]
              if "-" not in stem:
                  raise SystemExit(f"Could not parse sdist filename: {artifact.name}")
              name, version = stem.rsplit("-", 1)

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as out:
              out.write(f"name={name}\n")
              out.write(f"version={version}\n")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/britecore-sdk/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  smoke-test-install:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Smoke test install from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          PACKAGE_NAME="${{ needs.build.outputs.package_name }}"
          PACKAGE_VERSION="${{ needs.build.outputs.package_version }}"

          if [ -z "$PACKAGE_NAME" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "Package metadata outputs were empty. name='$PACKAGE_NAME' version='$PACKAGE_VERSION'"
            exit 1
          fi

          REQUIREMENT="${PACKAGE_NAME}==${PACKAGE_VERSION}"
          echo "Attempting to install $REQUIREMENT from PyPI"

          for attempt in 1 2 3 4 5; do
            python -m pip install "$REQUIREMENT" && break
            if [ "$attempt" -eq 5 ]; then
              echo "Package did not become available on PyPI in time."
              exit 1
            fi
            echo "Attempt $attempt failed. Waiting 30 seconds for PyPI index propagation..."
            sleep 30
          done

      - name: Smoke test import
        shell: bash
        run: |
          python - <<'PY'
          import britecore_sdk

          print(britecore_sdk.__version__)
          PY
