name: Docs Only PR Checks

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-only-checks:
    name: Docs-only QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect docs-impacting changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - 'scripts/docs_qa.py'
              - 'pyproject.toml'
            release_docs:
              - 'README.md'
              - 'CHANGELOG.md'
              - 'DEPRECATION.md'
              - 'GETTING_STARTED.md'
              - 'IMPROVEMENT_ROADMAP.md'
              - 'CONTRIBUTING.md'
              - 'pyproject.toml'
              - 'docs/DOCUMENTATION_RELEASE_CHECKLIST.md'
              - 'docs/RELEASE_OPERATIONS_CHECKLIST.md'
              - 'docs/MIGRATION_2_4_to_2_5.md'

      - name: Set up Python
        if: steps.changes.outputs.docs == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        if: steps.changes.outputs.docs == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Verify release-facing docs for versioned changes
        if: steps.changes.outputs.release_docs == 'true'
        run: python scripts/verify_release_docs.py

      - name: Run strict docs QA
        if: steps.changes.outputs.docs == 'true'
        run: python scripts/docs_qa.py

      - name: Skip docs QA when no docs-impacting files changed
        if: steps.changes.outputs.docs != 'true'
        run: echo "No docs-impacting file changes detected; docs-only QA skipped."
