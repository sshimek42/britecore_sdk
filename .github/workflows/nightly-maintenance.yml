name: Nightly Maintenance

on:
  schedule:
    - cron: "30 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pip-audit
        run: pip-audit --desc on

  wrapper-spec-drift-report:
    name: Wrapper/spec drift report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate mismatch report output
        run: |
          python tools/check_wrapper_spec_mismatch.py | tee wrapper-spec-mismatch.txt

      - name: Upload mismatch report artifact
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-spec-mismatch-report
          path: wrapper-spec-mismatch.txt
          if-no-files-found: error

  release-doc-consistency:
    name: Release docs consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify release-facing docs
        run: python scripts/verify_release_docs.py
