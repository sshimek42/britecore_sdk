name: Dependabot UV Lock Sync

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - "setup.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-uv-lock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          # Check out the Dependabot branch so we can push lockfile updates.
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Refresh uv lockfile
        run: uv lock

      - name: Commit and push updated uv.lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(deps): refresh uv.lock"
          git push
