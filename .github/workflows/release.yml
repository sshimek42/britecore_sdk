name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # needed to create GitHub Releases

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate tag format and version parity
        id: validate
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["TAG_NAME"]
          semver_pattern = r"^v(?P<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$"
          match = re.fullmatch(semver_pattern, tag)
          if not match:
              raise SystemExit(
                  f"Tag '{tag}' is invalid. Expected format: vMAJOR.MINOR.PATCH (optionally with -prerelease and/or +build metadata)."
              )

          tag_version = match.group("version")
          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)

          project_version = pyproject["project"]["version"]
          if tag_version != project_version:
              raise SystemExit(
                  f"Version mismatch: tag has '{tag_version}' but pyproject.toml has '{project_version}'."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={tag_version}\n")
          PY

  # ── 1. Run full test suite before releasing ───────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: validate-tag
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q --tb=short

  # ── 2. Build sdist + wheel ────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    outputs:
      version: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build


      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── 3. Extract release notes from CHANGELOG ───────────────────────────────
  changelog:
    name: Extract changelog notes
    runs-on: ubuntu-latest
    needs: build
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract notes for this version
        id: extract
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'EOF'
          import os, re

          version = os.environ["VERSION"]
          changelog = open("CHANGELOG.md").read()

          # Match the section for this version up to (but not including) the next ## heading
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, changelog, re.DOTALL)

          notes = match.group(1).strip() if match else f"Release {version}"

          # GitHub Actions multiline output
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("notes<<EOF_NOTES\n")
              f.write(notes + "\n")
              f.write("EOF_NOTES\n")
          EOF

  # ── 4. Create GitHub Release ──────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, changelog]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.build.outputs.version }}"
          body: ${{ needs.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # e.g. v1.2.0-beta
          files: dist/*
