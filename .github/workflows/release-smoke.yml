name: Release Smoke

on:
  pull_request:
    branches: [main, master, develop]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Release smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Enforce PR policy for release tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/check_release_smoke_policy.py


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests (release smoke)
        run: python -m pytest tests/unit -m unit -v --no-cov

      - name: Integration tests (release smoke)
        run: python -m pytest tests/integration -m integration -v --no-cov

      - name: Build distribution
        run: python -m build

      - name: Release compliance check
        run: pwsh -File ./scripts/release_compliance_check.ps1
