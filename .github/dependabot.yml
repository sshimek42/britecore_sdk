version: 2
updates:
  # Keep GitHub Actions up to date with one grouped PR per run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep Python dependencies current while reducing PR noise.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-runtime-deps:
        dependency-type: "production"
      python-dev-deps:
        dependency-type: "development"
    ignore:
      # Avoid surprise breaking transport changes in routine update waves.
      - dependency-name: "urllib3"
        update-types: ["version-update:semver-major"]
