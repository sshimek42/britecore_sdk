version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"

  # Keep Python dependencies up to date
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # Only allow patch/minor updates for core transport layer to avoid surprises
      - dependency-name: "urllib3"
        update-types: ["version-update:semver-major"]
