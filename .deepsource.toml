version = 1

exclude_patterns = [
  "build/**",
  "dist/**",
  ".venv/**",
  "env/**",
  ".pytest_cache/**",
  ".mypy_cache/**",
  ".ruff_cache/**",
  "*.egg-info/**",
  "htmlcov/**",
  "docs/**",
  "examples/**",
]

test_patterns = [
  "tests/**",
]

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 120
  skip_doc_coverage = ["module", "magic", "init", "class", "nonpublic"]

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "test-coverage"
enabled = true

[[transformers]]
name = "black"
enabled = false

[[transformers]]
name = "isort"
enabled = false
