repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 26.3.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pymarkdown
        name: pymarkdown (markdown only)
        entry: pymarkdown --config .pymarkdown scan
        language: python
        additional_dependencies: [pymarkdownlnt==0.9.32]
        files: \.md$
        exclude: ^(build/|dist/|env/|\.venv/|docs/_build/|htmlcov/)
