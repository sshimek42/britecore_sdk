repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: markdown-structure
        name: markdown structure check
        entry: python src/britecore_sdk/utils/check_markdown_structure.py
        language: python
        files: \.md$
        exclude: ^(build/|dist/|env/|\.venv/|docs/_build/|htmlcov/)
      - id: pymarkdown
        name: pymarkdown (markdown only)
        entry: pymarkdown --config .pymarkdown scan
        language: python
        additional_dependencies: [pymarkdownlnt==0.9.32]
        files: ^(README|CHANGELOG|AGENTS(\.quickstart)?|API|ARCHITECTURE|CONTRIBUTING|DEPRECATION|GETTING_STARTED|PYTHON_COMPATIBILITY|SECURITY|STABILITY|TROUBLESHOOTING|UNIMPLEMENTED_API_STUBS)\.md$|^docs/api_reference\.md$
        exclude: ^(build/|dist/|env/|\.venv/|docs/_build/|htmlcov/)
      - id: mypy
        name: Type check (mypy)
        # Run the same file set as scripts/ci_typecheck.py so local commits
        # catch type errors before CI does.  pass_filenames: false means the
        # hook always checks the full set regardless of which files changed.
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        args:
          - src/britecore_sdk/exceptions.py
          - src/britecore_sdk/api/britecore_api_client.py
          - src/britecore_sdk/api/britecore_async_api_client.py
          - src/britecore_sdk/api/britecore_oauth_token_manager.py
          - src/britecore_sdk/api/request_cache.py
          - src/britecore_sdk/api/types.py
          - src/britecore_sdk/api/api_calls/v1
          - src/britecore_sdk/api/api_calls/v2
          - src/britecore_sdk/settings/config.py
          - src/britecore_sdk/maps/__init__.py
          - src/britecore_sdk/models
          - src/britecore_sdk/validators
      - id: pytest-unit
        name: Unit tests (fast smoke)
        # Run only the unit-marked tests without coverage collection so the
        # hook completes quickly.  --no-cov overrides the addopts in pytest.ini
        # so the coverage threshold does not block the commit; full coverage is
        # still measured and enforced in CI.
        entry: pytest tests/unit -m unit -q --no-header --tb=short --no-cov
        language: system
        types: [python]
        pass_filenames: false
      - id: sphinx-build
        name: Sphinx documentation build
        # Catch doc build failures before pushing (matches RTD's fail_on_warning: true).
        # Uses python sphinx module to ensure it's available in all environments (local & CI).
        # Includes SDK runtime deps so autodoc can import britecore_sdk modules.
        entry: python -m sphinx -W --keep-going -b html ./docs ./docs/_build/html-strict
        language: python
        additional_dependencies: ['sphinx>=7.0', 'myst-parser>=1.0', 'sphinx-rtd-theme>=1.3', 'dynaconf>=3.3.2,<3.4.0', 'urllib3>=2.7.0,<3.0.0', 'toml>=0.10.2,<0.11.0']
        files: ^(docs/|README|AGENTS|API|ARCHITECTURE|CONTRIBUTING|DEPRECATION|GETTING_STARTED|PYTHON_COMPATIBILITY|SECURITY|STABILITY|TROUBLESHOOTING|UNIMPLEMENTED_API_STUBS|BATCH_QUOTE|CONFIG|EVENTS|MIGRATION|MULTI|OBSERVABILITY|RATE|STAGED|LINE)
        pass_filenames: false
      - id: release-compliance
        name: Release compliance check
        # Verify LICENSE, package metadata, and legal docs before pushing.
        # Runs at pre-push (not every commit) to keep commit flow fast.
        # Use -SkipDependencyLicenses to avoid pip-licenses overhead on every push;
        # run the full audit manually before tagging a release.
        entry: powershell -ExecutionPolicy Bypass -File scripts/release_compliance_check.ps1 -SkipDependencyLicenses
        language: system
        pass_filenames: false
        stages: [pre-push]
