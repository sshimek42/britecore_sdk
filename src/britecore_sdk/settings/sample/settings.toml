# Sample settings.toml — copy to src/britecore_sdk/settings/settings.toml and customize.
#
# This file contains default non-secret runtime settings.
# NEVER add credentials, base_url, api_key, client_id, or client_secret here.
# Those belong exclusively in .secrets.toml (which is gitignored).
#
# See docs/CONFIGURATION.md for full details.

[default]
web_timeout = 30
web_retry = 10
web_timeout_long = 60
# Optional SDK write safety policy: allow, warn, or block.
write_policy = "allow"
# Optional endpoint path fragment overrides for POST endpoints.
write_allowlist = []
write_denylist = []
# Optional request auditing middleware controls.
enable_audit_middleware = false
audit_only_writes = true
audit_log_level = "info"
# Optionally set the default target site here so you don't have to pass it
# explicitly in code or set the 'target_site' environment variable.
# target_site = "example_site"


# Add a section header for each site you configure.
# Leave the body empty, or add only non-sensitive settings.
[example_site]
# No credentials here — add them to .secrets.toml instead.

[example_site_test]
# No credentials here — add them to .secrets.toml instead.
