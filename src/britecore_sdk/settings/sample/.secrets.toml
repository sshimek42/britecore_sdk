# Sample .secrets.toml — copy to src/britecore_sdk/settings/.secrets.toml and fill in real values.
#
# This file contains ALL sensitive credentials and site-specific configuration.
# It is gitignored and must NEVER be committed to source control.
#
# Replace placeholder values with your actual credentials before use.
# See docs/CONFIGURATION.md for full details.

# Default section — values here apply to all sites unless overridden.
[default]
base_url = ""
client_id = ""
client_secret = ""
api_key = ""

# --- OAuth authentication example ---
# Use this pattern when authenticating with a client ID and secret.
[example_site]
base_url = "https://api.example.com"
client_id = "your_client_id"
client_secret = "your_client_secret"

# --- API key authentication example ---
# Use this pattern when authenticating with an API key only.
[example_site_test]
base_url = "https://api-test.example.com"
api_key = "your_api_key"
