[project]
name = "britecore_libraries"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "dynaconf~=3.2.13",
    "pandas~=3.0.1",
    "sclogging==1.2.1",
    "setuptools~=82.0.1",
    "typing_extensions>=4.6.0",
    "urllib3~=2.6.3",
]

[project.optional-dependencies]
database = [
    "pyodbc~=5.3.0",
]
browser = [
    "selenium~=4.41.0",
]
interactive = [
    "pyinputplus~=0.2.12",
]
all = [
    "britecore_libraries[database,browser,interactive]",
]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "black>=26.3.1",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "britecore_libraries[all]",
]
docs = [
    "sphinx>=9.1.0",
    "myst-parser>=5.0.0",
    "sphinx-rtd-theme>=3.1.0",
]

[project.entry-points."britecore_libraries"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
britecore_libraries = ["py.typed", "config/*.toml", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/britecore_libraries --cov-report=html --cov-report=term-missing --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests (mocked transport)",
    "sandbox: live sandbox tests (requires BRITECORE_INTEGRATION_TESTS=true)",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/britecore_libraries"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true

