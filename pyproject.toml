[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "britecore_sdk"
version = "1.1.0"
description = "Professional Python SDK for the BriteCore API — complete endpoint coverage, async support, OAuth/API key auth, and type hints."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "sshimek" }]
requires-python = ">=3.11"
keywords = ["britecore", "api", "sdk", "insurance", "async", "oauth2", "rest-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "dynaconf~=3.2.13",
    "typing_extensions>=4.15.0",
    "urllib3~=2.6.3",
    "toml>=0.10.2,<1.0.0",  # Added for utils/check_site_configs.py and utils/check_odbc_settings.py (Python 3.11+ compatible)
]

[project.optional-dependencies]
interactive = [
    "questionary~=2.1.0",
]
all = [
    "britecore_sdk[interactive]",
]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=3.16.0",
    "python-dotenv>=1.2.2",
    "black>=26.3.1",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pymarkdownlnt>=0.9.36",
    "pip-audit>=2.9.0",
    "britecore_sdk[all]",
]
docs = [
    "sphinx>=8.2.3,<9.1",
    "myst-parser>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
britecore_sdk = ["py.typed", "settings/*.toml", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/britecore_sdk --cov-report=html --cov-report=term-missing --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests (mocked transport)",
    "sandbox: live sandbox tests (requires BRITECORE_INTEGRATION_TESTS=true)",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/britecore_sdk"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
exclude = [
    "build/",
    "dist/",
    "env/",
    ".venv/",
    ".*egg-info/",
    "htmlcov/",
    "src/britecore_sdk/build/",
]
