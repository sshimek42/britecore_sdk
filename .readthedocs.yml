version: 2

# Build configuration
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Sphinx documentation build
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Python dependencies installation
# RTD automatically builds docs for each git tag matching v*.*.* pattern
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
